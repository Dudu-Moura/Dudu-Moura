<text x="48" y="62" font-size="16" font-weight="700" fill="#00ff9c" letter-spacing="2">// SOBRE_MIM.md</text><text x="802" y="62" font-size="11" text-anchor="end" fill="#00b3ff">são paulo · br</text><path d="M48 76H802" stroke="#00ff9c" stroke-opacity=".2"></path><text class="ln" x="48" y="106" font-size="13" style="animation-delay:0.2s"><tspan fill="#b9e6d3">Sou o Eduardo, tenho 19 anos, estudo</tspan><tspan dx="7.8" fill="#eafff5" font-weight="700">Ciência da Computação</tspan><tspan dx="7.8" fill="#b9e6d3">em São Paulo e gosto de</tspan></text><text class="ln" x="48" y="126" font-size="13" style="animation-delay:0.32s"><tspan fill="#b9e6d3">entender como os sistemas funcionam — e por que eles quebram.</tspan></text><text class="ln" x="48" y="160" font-size="13" style="animation-delay:0.44s"><tspan fill="#b9e6d3">Tenho</tspan><tspan dx="7.8" fill="#eafff5" font-weight="700">um ano e meio de experiência profissional</tspan><tspan dx="7.8" fill="#b9e6d3">em uma startup de IA que atende clientes</tspan></text><text class="ln" x="48" y="180" font-size="13" style="animation-delay:0.56s"><tspan fill="#b9e6d3">corporativos, trabalhando com bancos de dados, integrações, dados e monitoramento em</tspan></text><text class="ln" x="48" y="200" font-size="13" style="animation-delay:0.68s"><tspan fill="#b9e6d3">produção.</tspan></text><text class="ln" x="48" y="234" font-size="13" style="animation-delay:0.8s"><tspan fill="#b9e6d3">Hoje meu foco é</tspan><tspan dx="7.8" fill="#eafff5" font-weight="700">desenvolvimento backend</tspan><tspan dx="7.8" fill="#b9e6d3">com</tspan><tspan dx="7.8" fill="#eafff5" font-weight="700">Node.js, TypeScript e PostgreSQL</tspan><tspan dx="7.8" fill="#b9e6d3">—</tspan></text><text class="ln" x="48" y="254" font-size="13" style="animation-delay:0.92s"><tspan fill="#b9e6d3">principalmente processamento assíncrono, filas, workers e a construção de sistemas</tspan></text><text class="ln" x="48" y="274" font-size="13" style="animation-delay:1.04s"><tspan fill="#b9e6d3">robustos e escaláveis, que continuam confiáveis quando algo dá errado.</tspan></text><text class="ln" x="48" y="308" font-size="13" style="animation-delay:1.16s"><tspan fill="#b9e6d3">Fora do código, curto games e tecnologia desde criança — foi isso que despertou meu</tspan></text><text class="ln" x="48" y="328" font-size="13" style="animation-delay:1.28s"><tspan fill="#b9e6d3">interesse pela área.</tspan></text><g class="ln" style="animation-delay:1.4s"><text x="48" y="384" font-size="12" fill="#00b3ff" letter-spacing="1">ÁREAS DE INTERESSE</text><rect class="chip" x="220" y="366" width="51.4" height="28" rx="3" style="animation-delay:0s"></rect><text x="234" y="384" font-size="12" fill="#eafff5">SWE</text><rect class="chip" x="281.4" y="366" width="67" height="28" rx="3" style="animation-delay:0.5s"></rect><text x="295.4" y="384" font-size="12" fill="#eafff5">Cloud</text><rect class="chip" x="358.4" y="366" width="98.2" height="28" rx="3" style="animation-delay:1s"></rect><text x="372.4" y="384" font-size="12" fill="#eafff5">Segurança</text><rect class="chip" x="466.59999999999997" y="366" width="67" height="28" rx="3" style="animation-delay:1.5s"></rect><text x="480.59999999999997" y="384" font-size="12" fill="#eafff5">IA/ML</text><text x="547.5999999999999" y="384" font-size="13" fill="#00ff9c" class="blink">█</text></g><rect class="scan" x="24" width="802" height="2" fill="#00ff9c" fill-opacity=".15"></rect>
